plugins {
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = '1.0'
group = 'net.erutobusiness'
base { archivesName = 'shulker_on_back' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                shulker_on_back {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                shulker_on_back {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
    // Curios の作者が公開している maven。ここから取れば jar を手元に置かなくてよい。
    maven {
        name = "theillusivec4"
        url = "https://maven.theillusivec4.top/"
        content { includeGroup "top.theillusivec4.curios" }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
    // Curios API の解決用。実行時は Curios 本体が居る前提なので同梱しない。
    // ⚠ 2026-08-07 に `files('libs/curios.jar')` から maven へ移した。
    //    手元に jar を置く方式だと、**clone した人がビルドできない**（どのMODのどの版を
    //    どの名前で置くのか分からない）うえ、CI も回せなかった。
    //    版は instance/mods の実物と同じ 5.14.1+1.20.1（SHA1 照合ずみ）。
    compileOnly "top.theillusivec4.curios:curios-forge:5.14.1+1.20.1"
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : 'shulker_on_back',
                'Specification-Vendor'    : 'erutobusiness',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : 'erutobusiness',
        ])
    }
}
